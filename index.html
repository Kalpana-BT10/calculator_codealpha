
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator | CodeAlpha</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101827, #26354c);
    font-family: Arial, sans-serif;
}

.calculator {
    width: 340px;
    padding: 25px;
    border-radius: 22px;
    background: #182438;
    box-shadow: 0 15px 40px #0008;
}

h2 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

#display {
    width: 100%;
    height: 75px;
    margin-bottom: 20px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: #0d1727;
    color: white;
    font-size: 30px;
    text-align: right;
    padding: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    font-size: 21px;
    cursor: pointer;
    background: #293a53;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #405575;
    transform: scale(1.04);
}

.operator {
    background: #ed9145;
}

.clear {
    background: #d94c5c;
}

.equal {
    background: #27a879;
    grid-column: span 2;
}

.zero {
    grid-column: span 2;
}

footer {
    text-align: center;
    color: #aab8cc;
    margin-top: 20px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="calculator">
    <h2>CALCULATOR</h2>

    <input type="text" id="display"
           placeholder="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>

        <button class="zero" onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <footer>Developed for CodeAlpha Internship</footer>
</div>

<script>
const display = document.getElementById("display");

function append(value) {
    if (display.value === "Error") display.value = "";
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function deleteLast() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        const expression = display.value;

        if (!expression ||
            !/^[0-9+\-*/%.() ]+$/.test(expression)) {
            throw new Error("Invalid input");
        }

        const result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
            throw new Error("Invalid calculation");
        }

        display.value = Number(result.toPrecision(12)).toString();
    } catch {
        display.value = "Error";
    }
}

document.addEventListener("keydown", (event) => {
    if (/^[0-9.+\-*/%]$/.test(event.key)) {
        append(event.key);
    } else if (event.key === "Enter" || event.key === "=") {
        calculate();
    } else if (event.key === "Backspace") {
        deleteLast();
    } else if (event.key === "Escape") {
        clearDisplay();
    }
});
</script>

</body>
</html>
